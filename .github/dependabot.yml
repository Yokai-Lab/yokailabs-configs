version: 2

# One weekly PR for every ecosystem, so updates land as one change to review.
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: all
    patterns: ['*']
    ignore:
      # eslint-config's peer is eslint ^9, and the typescript-eslint it bundles supports a
      # bounded TypeScript range, so these majors move only as a deliberate release that raises
      # the peer; a bump alone ships a config whose dependencies contradict its peer.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all
    patterns: ['*']
